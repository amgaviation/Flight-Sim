# Builds the Windows installer + portable exe on every push (any branch) and on demand,
# and runs typecheck/tests/web build on Linux.
name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, test, web build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  windows:
    name: Windows exe (NSIS installer + portable)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      # No code-signing certificate: build unsigned without probing the cert store.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build installer and portable exe
        run: npm run dist:win -- --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AMG-Flight-Simulator-Setup
          path: release/AMG-Flight-Simulator-Setup-*.exe
          if-no-files-found: error
      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: AMG-Flight-Simulator-Portable
          path: release/AMG-Flight-Simulator-*-portable.exe
          if-no-files-found: error
